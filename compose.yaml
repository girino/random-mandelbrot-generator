services:
  nostr-publish:
    build:
      context: .
    env_file:
      - .env
    environment:
      FRACT_BIN: /usr/local/bin/fract
      NAK_BIN: /usr/local/bin/nak
      FRACT_OUTPUT_DIR: /output
      FRACT_INTERVAL_SECONDS: "1800"
    volumes:
      - ./output:/output
    command: ["--random-palette", "--max-iterations", "1048576"]
